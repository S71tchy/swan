[project]
name = "swan-server"
version = "0.1.0"
description = "SWAN — Strategic Warning & Alert Network (Phase 1 backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
